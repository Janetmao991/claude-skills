          R.map.forEach(function (m) { var c = px(m); boxes.push({ x: c[0] - 11, y: c[1] - 11, w: 22, h: 22 }); });
          R.map.forEach(function (m) {
            var c = px(m), d = el("circle", { cx: c[0], cy: c[1], r: 11, fill: COL[m.group] || "#b9b1a2", opacity: 0 });
            var ta = t + 0.45 + order.indexOf(m.group) * 0.2;
            tl.fromTo(d, { attr: { opacity: 0, r: 2 } }, { attr: { opacity: 1, r: 11 }, duration: 0.25, ease: "back.out(3)", immediateRender: false }, ta);

            boxes.push({ x: at[0], y: at[1], w: w, h: h });
            var lb = el("text", { x: at[0], y: at[1] + 26, opacity: 0 }); lb.textContent = m.text;
            tl.to(lb, { attr: { opacity: 1 }, duration: 0.2 }, ta + 0.1);
          });
          var score = function (lk, val, tt) {
            tl.set(lk.el, { attr: { opacity: 1 } }, tt);
            tl.to(lk.el, { attr: { x2: lk.B[0], y2: lk.B[1] }, duration: 0.5, ease: "power2.out" }, tt);
            var mx = (lk.A[0] + lk.B[0]) / 2, my = (lk.A[1] + lk.B[1]) / 2, bx = { x: mx + 14, y: my - 36, w: 92, h: 40 };
            if (hit(bx)) bx.x = mx - 106;
            boxes.push(bx);
            var s = el("text", { x: bx.x, y: bx.y + 32, class: "sc", opacity: 0 }); s.textContent = val.toFixed(2);
            tl.to(s, { attr: { opacity: 1 }, duration: 0.2 }, tt + 0.45);
          };
          score(near, R.pair.near[2], t + 1.7);
          score(far, R.pair.far[2], t + 2.6);
          $("pj-n1").textContent = R.pair.near[2].toFixed(2); $("pj-n2").textContent = R.pair.far[2].toFixed(2);
          push("#pj-cam", t + 0.3, end, 1.04);
        },
        grid: function (t, end) {
          var g = ""; R.vec.forEach(function (x) { g += "<span" + (x < 0 ? ' class="neg"' : "") + ">" + fmt(x) + "</span>"; });
          $("gd-in").innerHTML = g;
          var rows = Math.ceil(R.vec.length / 5), cnt = { v: 0 }, d = Math.max(1.5, end - t - 1.2);
          tl.fromTo("#gd-in", { y: 16 }, { y: -(rows - 10) * 40, duration: d, ease: "power2.in" }, t + 0.4);
          tl.fromTo(cnt, { v: 0 }, { v: R.vec.length, duration: d, ease: "power2.in", onUpdate: function () { $("gd-n").textContent = Math.round(cnt.v); } }, t + 0.4);
          tl.fromTo("#gd-badge", { scale: 1 }, { scale: 1.12, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, t + 0.4 + d);
        },
        rank: function (t, end) {

          $("rk-v").textContent = "↓ [" + R.vec.slice(0, 3).map(function (x) { return x.toFixed(3); }).join(", ") + ", …]";

          }).join("");

          var tr = td + 0.45;
          document.querySelectorAll("#rk-rows .rk").forEach(function (row, i) {
            tl.to(row, { opacity: 1, duration: 0.15 }, tr + i * 0.1);

          tl.fromTo("#h-openai", { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, t + 2.2);
        },
        chat: function (t, end) {
          $("ch-u").textContent = R.query;
          var sp = chars($("ch-b"), R.answer.text);

          tl.fromTo("#ch-u", { opacity: 0, y: 14, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, t + 0.45);
          tl.set("#ch-ty", { opacity: 1 }, t + 0.85);

          var tb = t + 1.6;

          var te = type(sp, tb, Math.min(0.03, 2.4 / sp.length));

          tl.to("#h-airbnb", { opacity: 0, duration: 0.25 }, t + 2.3);
          tl.to("#p-airbnb", { scale: B.scale, x: B.x, y: B.y, duration: 1.6, ease: "power2.inOut" }, t + 2.4);
        },
      };

      // each block: a hand-drawn frame is drawn on the page, the screen is taped in, shots swap inside
      window.REAL_BLOCKS.forEach(function (b) {
        var frame = SK.rect(svg, 984, 378, 832, 500, { strokeWidth: 4, roughness: 1.2 });
        SK.draw(tl, frame, b.in, 0.45);
        tl.to(frame, { attr: { opacity: 0 }, duration: 0.3 }, b.out - 0.3);

      window.__timelines[N] = tl;
